[build]
  publish = "."
  command = ""

# Den gamle catch-all (alle ukendte adresser -> smvcore.html) er fjernet.
# smvcore.html var en forældet version af forsiden med en kontaktformular,
# der ikke sendte noget, og en forkert e-mailadresse.
[[redirects]]
  from = "/smvcore.html"
  to = "/"
  status = 301

[build.environment]
  NODE_VERSION = "18"
